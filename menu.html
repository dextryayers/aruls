<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<title>BastAI — Menu</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Poppins',sans-serif;background:#050510;color:#fff}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
#menu{position:relative;z-index:10;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.logo{font-family:'Orbitron',monospace;font-size:42px;font-weight:700;margin-bottom:10px;background:linear-gradient(90deg,#00d4ff,#7b2ff7,#ff00d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:glow 3s ease-in-out infinite;text-shadow:none;filter:drop-shadow(0 0 20px rgba(0,212,255,.5))}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 20px rgba(0,212,255,.5))}50%{filter:drop-shadow(0 0 40px rgba(123,47,247,.8))}}
.subtitle{font-size:14px;color:rgba(255,255,255,.5);letter-spacing:4px;text-transform:uppercase;margin-bottom:50px}
.menu-grid{display:flex;flex-direction:column;gap:16px;width:min(400px,90%)}
.menu-item{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;background:linear-gradient(135deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.1);border-radius:16px;cursor:pointer;transition:all .3s;backdrop-filter:blur(10px);text-decoration:none;color:#fff;animation:slideUp .6s ease-out both}
.menu-item:nth-child(1){animation-delay:.1s}
.menu-item:nth-child(2){animation-delay:.2s}
.menu-item:nth-child(3){animation-delay:.3s}
.menu-item:nth-child(4){animation-delay:.4s}
.menu-item:nth-child(5){animation-delay:.5s}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.menu-item:hover{transform:translateX(8px);background:linear-gradient(135deg,rgba(0,212,255,.15),rgba(123,47,247,.1));border-color:rgba(0,212,255,.4);box-shadow:0 0 30px rgba(0,212,255,.2)}
.menu-item .icon{font-size:24px;margin-right:15px}
.menu-item .label{flex:1;text-align:left;font-weight:600;font-size:16px}
.menu-item .arrow{color:rgba(255,255,255,.3);font-size:18px;transition:.3s}
.menu-item:hover .arrow{color:#00d4ff;transform:translateX(5px)}
.menu-item.coming-soon{opacity:.5;cursor:not-allowed}
.menu-item.coming-soon:hover{transform:none;background:linear-gradient(135deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border-color:rgba(255,255,255,.1);box-shadow:none}
.badge{font-size:10px;padding:4px 10px;background:linear-gradient(135deg,#7b2ff7,#ff00d4);border-radius:20px;font-weight:600;margin-left:10px}
.qr-section{margin-top:40px;padding:20px;background:rgba(255,255,255,.05);border-radius:16px;border:1px solid rgba(255,255,255,.1);animation:slideUp .6s ease-out .6s both}
.qr-section p{font-size:12px;color:rgba(255,255,255,.5);margin-bottom:12px}
.qr-box{width:200px;height:200px;background:#fff;border-radius:12px;margin:0 auto;overflow:hidden;box-shadow:0 0 20px rgba(0,212,255,.3)}
.planet{position:fixed;border-radius:50%;animation:orbit 20s linear infinite}
.p1{width:60px;height:60px;background:linear-gradient(135deg,#ff6b6b,#ee5a24);top:10%;left:8%;animation-duration:25s;box-shadow:0 0 30px rgba(255,107,107,.4)}
.p2{width:40px;height:40px;background:linear-gradient(135deg,#74c5ea,#3498db);top:70%;right:10%;animation-duration:18s;animation-delay:-5s;box-shadow:0 0 25px rgba(116,197,234,.4)}
.p3{width:25px;height:25px;background:linear-gradient(135deg,#ffd93d,#f39c12);bottom:15%;left:15%;animation-duration:30s;animation-delay:-10s;box-shadow:0 0 20px rgba(255,217,61,.4)}
@keyframes orbit{0%{transform:rotate(0deg) translateX(20px) rotate(0deg)}100%{transform:rotate(360deg) translateX(20px) rotate(-360deg)}}
.shooting-star{position:fixed;width:3px;height:80px;background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,200,100,.6),transparent);border-radius:50%;animation:meteor 2s linear infinite;opacity:0}
.shooting-star:nth-child(1){left:15%;animation-delay:0s;animation-duration:2.5s}
.shooting-star:nth-child(2){left:45%;animation-delay:1s;animation-duration:1.8s}
.shooting-star:nth-child(3){left:75%;animation-delay:2s;animation-duration:2.2s}
.shooting-star:nth-child(4){left:30%;animation-delay:0.5s;animation-duration:3s}
.shooting-star:nth-child(5){left:60%;animation-delay:1.5s;animation-duration:2s}
@keyframes meteor{0%{opacity:0;top:-5%;transform:rotate(15deg)}10%{opacity:1}80%{opacity:1}100%{opacity:0;top:105%;transform:rotate(15deg)}}
.floating-star{position:fixed;color:#fff;font-size:12px;animation:floatStar 6s ease-in-out infinite;opacity:.6}
.floating-star:nth-child(6){left:5%;top:20%;animation-delay:0s;font-size:10px}
.floating-star:nth-child(7){left:20%;top:60%;animation-delay:1s;font-size:14px}
.floating-star:nth-child(8){left:40%;top:80%;animation-delay:2s;font-size:8px}
.floating-star:nth-child(9){left:65%;top:30%;animation-delay:0.5s;font-size:12px}
.floating-star:nth-child(10){left:85%;top:70%;animation-delay:1.5s;font-size:10px}
.floating-star:nth-child(11){left:50%;top:10%;animation-delay:2.5s;font-size:16px}
.floating-star:nth-child(12){left:90%;top:45%;animation-delay:3s;font-size:9px}
@keyframes floatStar{0%,100%{transform:translateY(0) translateX(0) scale(1);opacity:.4}25%{transform:translateY(-15px) translateX(10px) scale(1.2);opacity:.8}50%{transform:translateY(-5px) translateX(-5px) scale(.9);opacity:.6}75%{transform:translateY(-20px) translateX(8px) scale(1.1);opacity:.9}}
.settings-btn{position:fixed;top:20px;right:20px;z-index:30;width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,rgba(0,212,255,.2),rgba(123,47,247,.2));border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(10px);cursor:pointer;font-size:22px;display:flex;align-items:center;justify-content:center;transition:.3s}
.settings-btn:hover{transform:rotate(90deg);box-shadow:0 0 25px rgba(0,212,255,.4);border-color:rgba(0,212,255,.5)}
#settingsPanel{position:fixed;top:80px;right:20px;z-index:30;width:300px;padding:20px;border-radius:16px;background:linear-gradient(135deg,rgba(15,25,40,.95),rgba(10,18,32,.98));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(100,200,255,.2);box-shadow:0 8px 32px rgba(0,0,0,.5);display:none;max-height:70vh;overflow-y:auto}
#settingsPanel.open{display:block;animation:fadeIn .3s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
#settingsPanel h2{margin:0 0 15px;font-size:16px;font-family:'Orbitron',monospace;color:#64c8ff;border-bottom:1px solid rgba(100,200,255,.2);padding-bottom:10px;letter-spacing:2px}
.setting{display:flex;justify-content:space-between;align-items:center;margin:12px 0;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.setting span{font-size:13px;color:rgba(255,255,255,.85)}
.setting select{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;padding:6px 10px;border-radius:8px;font-size:12px;cursor:pointer;min-width:100px}
.setting input[type="checkbox"]{width:40px;height:20px;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,.2);border-radius:10px;position:relative;cursor:pointer;transition:.3s}
.setting input[type="checkbox"]::before{content:'';position:absolute;width:16px;height:16px;background:#fff;border-radius:50%;top:2px;left:2px;transition:.3s}
.setting input[type="checkbox"]:checked{background:linear-gradient(135deg,#00d4ff,#7b2ff7)}
.setting input[type="checkbox"]:checked::before{left:22px}
.close-btn{width:100%;margin-top:15px;background:linear-gradient(135deg,#00d4ff,#7b2ff7);border:none;color:#fff;padding:10px;border-radius:10px;font-weight:600;cursor:pointer;transition:.3s;font-size:14px}
.close-btn:hover{transform:scale(1.02);box-shadow:0 4px 20px rgba(0,212,255,.4)}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="planet p1"></div>
<div class="planet p2"></div>
<div class="planet p3"></div>
<div class="shooting-star"></div>
<div class="shooting-star"></div>
<div class="shooting-star"></div>
<div class="shooting-star"></div>
<div class="shooting-star"></div>
<div class="floating-star">✦</div>
<div class="floating-star">✧</div>
<div class="floating-star">✦</div>
<div class="floating-star">✧</div>
<div class="floating-star">✦</div>
<div class="floating-star">✧</div>
<div class="floating-star">✦</div>
<button class="settings-btn" onclick="toggleSettings()">⚙</button>
<aside id="settingsPanel">
<h2>⚙ SETTINGS</h2>
<div class="setting"><span>🌙 Mode Gelap</span><input type="checkbox" id="darkMode" checked></div>
<div class="setting"><span>🔤 Ukuran Font</span><select id="fontSize"><option value="14">Kecil</option><option value="16" selected>Sedang</option><option value="20">Besar</option></select></div>
<div class="setting"><span>✨ Animasi</span><input type="checkbox" id="animToggle" checked></div>
<div class="setting"><span>☄️ Meteor</span><input type="checkbox" id="meteorToggle" checked></div>
<div class="setting"><span>⭐ Bintang</span><input type="checkbox" id="starToggle" checked></div>
<div class="setting"><span>🪐 Planet</span><input type="checkbox" id="planetToggle" checked></div>
<button class="close-btn" onclick="toggleSettings()">Tutup</button>
</aside>
<div id="menu">
  <div class="logo">BastAI</div>
  <div class="subtitle">World Menu</div>
  <div class="menu-grid">
    <a href="https://chatgpt.com" target="_blank" class="menu-item">
      <span class="icon">🤖</span>
      <span class="label">ChatGPT BastAI</span>
      <span class="arrow">→</span>
    </a>
    <div class="menu-item coming-soon">
      <span class="icon">🌐</span>
      <span class="label">Website <span class="badge">OTW</span></span>
      <span class="arrow">→</span>
    </div>
    <div class="menu-item coming-soon">
      <span class="icon">🎮</span>
      <span class="label">Games <span class="badge">OTW</span></span>
      <span class="arrow">→</span>
    </div>
    <div class="menu-item coming-soon">
      <span class="icon">📱</span>
      <span class="label">Apps <span class="badge">OTW</span></span>
      <span class="arrow">→</span>
    </div>
    <a href="world.html" class="menu-item">
      <span class="icon">🌍</span>
      <span class="label">BastAI World</span>
      <span class="arrow">→</span>
    </a>
  </div>
  <div class="qr-section">
    <p>Scan QR untuk akses cepat</p>
    <div class="qr-box"><img src="IMG-20260824-WA0102.jpg" alt="QR Code" style="width:100%;height:100%;object-fit:cover;border-radius:12px"></div>
  </div>
</div>
<script>
const canvas=document.getElementById('stars'),ctx=canvas.getContext('2d');
let W,H;
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}
resize();addEventListener('resize',resize);
const stars=[];
for(let i=0;i<200;i++)stars.push({x:Math.random()*2000,y:Math.random()*2000,r:Math.random()*1.5+.5,a:Math.random(),da:Math.random()*.02-.01});
function draw(){
  ctx.fillStyle='#050510';ctx.fillRect(0,0,W,H);
  stars.forEach(s=>{
    s.a+=s.da;if(s.a>1||s.a<0)s.da=-s.da;
    ctx.beginPath();ctx.arc(s.x%W,s.y%H,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${s.a})`;ctx.fill();
  });
  requestAnimationFrame(draw);
}
draw();
function toggleSettings(){document.getElementById('settingsPanel').classList.toggle('open')}
document.getElementById('darkMode').onchange=e=>{document.body.style.background=e.target.checked?'#050510':'#1a1a2e';document.querySelector('canvas').style.opacity=e.target.checked?'1':'0.3'};
document.getElementById('fontSize').onchange=e=>{document.querySelectorAll('.menu-item .label,.subtitle,.qr-section p').forEach(el=>{el.style.fontSize=e.target.value+'px'})};
document.getElementById('animToggle').onchange=e=>{const state=e.target.checked?'running':'paused';document.querySelectorAll('.logo,.menu-item,.planet,.floating-star').forEach(el=>{el.style.animationPlayState=state})};
document.getElementById('meteorToggle').onchange=e=>{document.querySelectorAll('.shooting-star').forEach(el=>{el.style.display=e.target.checked?'block':'none'})};
document.getElementById('starToggle').onchange=e=>{document.querySelectorAll('.floating-star').forEach(el=>{el.style.display=e.target.checked?'block':'none'});document.querySelector('canvas').style.display=e.target.checked?'block':'none'};
document.getElementById('planetToggle').onchange=e=>{document.querySelectorAll('.planet').forEach(el=>{el.style.display=e.target.checked?'block':'none'})};
</script>
</body>
</html>
