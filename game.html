<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BastAI World — Play</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif;background:#0a0a1a;color:#fff}
canvas{display:block}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
#score{position:absolute;top:20px;left:20px;font-size:24px;font-weight:700;text-shadow:0 2px 10px #000}
#info{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:14px;opacity:.7;text-align:center}
.controls{position:absolute;bottom:20px;right:20px;display:flex;gap:10px;pointer-events:all}
.btn{padding:12px 24px;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s}
.btn:hover{transform:scale(1.05)}
.btn-play{background:linear-gradient(135deg,#4CAF50,#2E7D32);color:#fff}
.btn-back{background:rgba(255,255,255,.15);color:#fff;backdrop-filter:blur(5px)}
#particles{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.star{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;animation:twinkle 2s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:1;transform:scale(1.5)}}
.orb{position:absolute;border-radius:50%;animation:float 6s ease-in-out infinite;pointer-events:none}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-30px) scale(1.1)}}
#player{position:absolute;width:50px;height:50px;background:linear-gradient(135deg,#ff6b6b,#ee5a24);border-radius:50%;box-shadow:0 0 30px #ff6b6b;transition:transform .1s;cursor:pointer}
#target{position:absolute;width:40px;height:40px;background:linear-gradient(135deg,#ffd93d,#ff6b35);border-radius:50%;box-shadow:0 0 25px #ffd93d;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 25px #ffd93d}50%{transform:scale(1.2);box-shadow:0 0 40px #ffd93d}}
#effect{position:absolute;pointer-events:none;font-size:30px;animation:popUp .8s ease-out forwards}
@keyframes popUp{0%{opacity:1;transform:scale(0) translateY(0)}50%{transform:scale(1.5) translateY(-20px)}100%{opacity:0;transform:scale(1) translateY(-60px)}}
.level-badge{position:absolute;top:20px;right:20px;padding:8px 16px;background:rgba(255,255,255,.1);border-radius:20px;font-size:14px;backdrop-filter:blur(5px)}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="particles"></div>
<div id="ui">
  <div id="score">Score: <span id="points">0</span></div>
  <div class="level-badge">Level <span id="level">1</span></div>
  <div id="player"></div>
  <div id="target"></div>
  <div id="info">Click or tap the glowing orbs! | Arrow keys or WASD to move</div>
  <div class="controls">
    <button class="btn btn-back" onclick="location.href='world.html'">← Back</button>
  </div>
</div>
<script>
const canvas=document.getElementById('bg'),ctx=canvas.getContext('2d');
let W,H;
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}
resize();addEventListener('resize',resize);

const particles=[];
class Particle{
  constructor(){this.reset()}
  reset(){this.x=Math.random()*W;this.y=Math.random()*H;this.vx=(Math.random()-.5)*.5;this.vy=(Math.random()-.5)*.5;this.r=Math.random()*2+1;this.alpha=Math.random()*.5+.2;this.color=`hsl(${Math.random()*60+180},70%,70%)`}
  update(){this.x+=this.vx;this.y+=this.vy;if(this.x<0||this.x>W||this.y<0||this.y>H)this.reset()}
  draw(){ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fillStyle=this.color;ctx.globalAlpha=this.alpha;ctx.fill();ctx.globalAlpha=1}
}
for(let i=0;i<80;i++)particles.push(new Particle());

let score=0,level=1,playerX=100,playerY=100,targetX=300,targetY=300;
const player=document.getElementById('player'),target=document.getElementById('target'),pointsEl=document.getElementById('points'),levelEl=document.getElementById('level');
const keys={};

function moveTarget(){
  targetX=Math.random()*(W-80)+40;
  targetY=Math.random()*(H-80)+40;
  target.style.left=targetX+'px';target.style.top=targetY+'px';
  target.style.background=`linear-gradient(135deg,hsl(${Math.random()*360},80%,60%),hsl(${Math.random()*360},80%,40%))`;
}
moveTarget();

function updatePlayer(){
  const speed=5+level*2;
  if(keys.ArrowUp||keys.w)playerY-=speed;
  if(keys.ArrowDown||keys.s)playerY+=speed;
  if(keys.ArrowLeft||keys.a)playerX-=speed;
  if(keys.ArrowRight||keys.d)playerX+=speed;
  playerX=Math.max(0,Math.min(W-50,playerX));
  playerY=Math.max(0,Math.min(H-50,playerY));
  player.style.left=playerX+'px';player.style.top=playerY+'px';
}

function checkCollision(){
  const dx=playerX+25-(targetX+20),dy=playerY+25-(targetY+20);
  if(Math.sqrt(dx*dx+dy*dy)<45){
    score+=10*level;
    pointsEl.textContent=score;
    if(score>=level*100){level++;levelEl.textContent=level;levelEl.parentElement.style.animation='none';levelEl.parentElement.offsetHeight;levelEl.parentElement.style.animation=''}
    showEffect(targetX,targetY);
    moveTarget();
  }
}

function showEffect(x,y){
  const el=document.createElement('div');
  el.id='effect';el.textContent=['✨','🌟','⭐','💫'][Math.floor(Math.random()*4)];
  el.style.left=x+'px';el.style.top=y+'px';
  document.getElementById('ui').appendChild(el);
  setTimeout(()=>el.remove(),800);
}

function animate(){
  ctx.fillStyle='rgba(10,10,26,0.1)';ctx.fillRect(0,0,W,H);
  particles.forEach(p=>{p.update();p.draw()});
  for(let i=0;i<particles.length;i++){
    for(let j=i+1;j<particles.length;j++){
      const dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<120){
        ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);ctx.lineTo(particles[j].x,particles[j].y);
        ctx.strokeStyle=`rgba(100,200,255,${(1-dist/120)*0.2})`;ctx.stroke();
      }
    }
  }
  updatePlayer();checkCollision();
  requestAnimationFrame(animate);
}
animate();

document.addEventListener('keydown',e=>{keys[e.key]=true;e.preventDefault()});
document.addEventListener('keyup',e=>{keys[e.key]=false});

player.addEventListener('click',()=>{
  player.style.transform='scale(1.3)';
  setTimeout(()=>player.style.transform='scale(1)',200);
});

target.addEventListener('click',()=>{
  score+=10*level;pointsEl.textContent=score;
  if(score>=level*100){level++;levelEl.textContent=level}
  showEffect(targetX,targetY);moveTarget();
});

let touchX,touchY;
document.addEventListener('touchstart',e=>{touchX=e.touches[0].clientX;touchY=e.touches[0].clientY});
document.addEventListener('touchmove',e=>{
  const dx=e.touches[0].clientX-touchX,dy=e.touches[0].clientY-touchY;
  playerX+=dx;playerY+=dy;
  playerX=Math.max(0,Math.min(W-50,playerX));
  playerY=Math.max(0,Math.min(H-50,playerY));
  touchX=e.touches[0].clientX;touchY=e.touches[0].clientY;
  e.preventDefault();
},{passive:false});

for(let i=0;i<20;i++){
  const star=document.createElement('div');star.className='star';
  star.style.left=Math.random()*100+'%';star.style.top=Math.random()*100+'%';
  star.style.animationDelay=Math.random()*2+'s';
  document.getElementById('particles').appendChild(star);
}
</script>
</body>
</html>
