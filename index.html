<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BastAI World — Start</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#102d1d,#244f35);color:#fff}
.start{height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.box{width:min(800px,92%);padding:45px 25px}
.logo{font-size:30px;font-weight:800;margin-bottom:35px}
h1{font-size:clamp(34px,6vw,70px);line-height:1.08;margin:0}
.name{font-size:clamp(18px,2.5vw,25px);margin-top:15px;opacity:.9}
.start-btn{display:inline-block;margin-top:42px;padding:15px 42px;border-radius:14px;background:#fff;color:#163321;text-decoration:none;font-size:19px;font-weight:700;box-shadow:0 8px 25px #0004}
.start-btn:hover{transform:translateY(-2px)}
</style>
</head>
<body>
<main class="start">
  <div class="box">
    <div class="logo">BastAI</div>
    <h1>Selamat Datang di BastAI World</h1>
    <div class="name">Tuan Arul</div>
    <a class="start-btn" href="world.html">▶ Mulai</a>
  </div>
</main>
</body>
</html>
